name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # Submodules are fetched selectively by scripts/smoke.sh (tcc).
        # liblfds is optional (native ring queue backend) and its upstream
        # host is unreliable, so we never fetch it in CI.

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libcurl4-openssl-dev

      - name: Smoke test (build toolchain, compile + run examples)
        run: ./scripts/smoke.sh

  # The bridge suites are the material that actually exercises the
  # interop wires (forged replies, crash storms, shm spills, callback
  # nesting) — gate on them, not just the toolchain smoke.
  bridges:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # Same selective fetch as smoke: tcc only (see scripts/smoke.sh).

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libcurl4-openssl-dev python3-dev python3-numpy

      - name: Fetch TinyCC submodule
        run: |
          git submodule update --init third_party/tcc
          if [ ! -f third_party/tcc/configure ]; then
            git submodule update --checkout --force third_party/tcc
          fi

      - name: Build toolchain
        run: make -C cc

      # bridge_wire / cc_python_* / stress load the in-repo addon via
      # npm/cc-python (bin/cc_python.node). Toolchain make does not build it.
      - name: Build cc-python addon
        run: ./cc/bin/ccc build npm/cc-python/src/cc_python.ccs -o bin/cc_python.node

      - name: Bridge smokes (pinned wire/package rungs)
        run: |
          mkdir -p out/tools
          cc -O2 -Wall -Wextra -D_FILE_OFFSET_BITS=64 tools/cc_test.c -o out/tools/cc_test
          ./out/tools/cc_test --filter bridge_wire
          ./out/tools/cc_test --filter cc_node_bridge
          ./out/tools/cc_test --filter cc_python_bridge

      - name: Bridge stress (quick tier)
        run: ./stress/bridge/run.sh

  # Concurrent-C runtime under ASan / TSan (fibers, nurseries, channels).
  # Linux-only: Darwin ASan+fibers hangs (see docs/sanitizers.md).
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libcurl4-openssl-dev

      - name: Fetch TinyCC submodule
        run: |
          git submodule update --init third_party/tcc
          if [ ! -f third_party/tcc/configure ]; then
            git submodule update --checkout --force third_party/tcc
          fi

      - name: Build toolchain
        run: make cc -j"$(nproc)"

      - name: TSan tests
        env:
          CC: clang
        run: ./scripts/test_tsan.sh --timeout 60s

      - name: Stress ASan
        env:
          CC: clang
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:detect_stack_use_after_return=0
          STRESS_TIMEOUT: '90'
        run: ./scripts/stress_sanitize.sh asan

      - name: Stress TSan
        env:
          CC: clang
          STRESS_TIMEOUT: '90'
        run: ./scripts/stress_sanitize.sh tsan
